name: Python CI

on:
 push:
  branches: ["main"]
jobs:
 run-python:
  runs-on: ubuntu-latest
  steps:
    - name: checkout code
      uses: actions/checkout@v4
    - name: setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Run python program
      run: python app.py
      
    
